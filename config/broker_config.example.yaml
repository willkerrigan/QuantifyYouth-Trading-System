alpaca:
  api_key: "${ALPACA_API_KEY}"
  secret_key: "${ALPACA_SECRET_KEY}"
  # Endpoint is chosen by trading.paper_trading (paper vs live). Set url_override
  # only for non-standard endpoints such as the broker sandbox.
  # url_override: "https://paper-api.alpaca.markets"

trading:
  paper_trading: true
  market: "US"
  account_type: "margin"
  
position_management:
  max_open_positions: 10
  # Fraction of available buying power deployed into each new position.
  # Must be > 0; defaults to 0.1 when omitted. Orders whose notional value
  # exceeds available buying power are refused.
  max_position_pct: 0.1
  position_size_mode: "equal"
  trailing_stop: 0.05
  
signal_processing:
  signal_ttl_seconds: 60
  batch_size: 5
  retry_on_failure: true
  retry_max_attempts: 3

logging:
  level: "INFO"
  file: "logs/trading.log"
  console: true
