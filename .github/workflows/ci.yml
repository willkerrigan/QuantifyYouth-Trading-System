name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # numpy==1.24.3 in requirements.txt only ships wheels up to cp311,
        # so 3.11 is the highest interpreter the current pins support.
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install project (editable, no deps)
        # Makes backtester/, optimizer/, and execution/ importable without
        # any PYTHONPATH juggling. --no-deps because requirements.txt above
        # is the single source of truth for pinned runtime dependencies.
        run: pip install -e . --no-deps

      - name: Run tests
        # The suite must stay hermetic: no network calls and no broker
        # credentials. Do not add API-key secrets to this job.
        run: pytest tests/ -v
