[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantifyyouth-trading-system"
version = "0.1.0"
description = "Algorithmic trading platform with backtesting, parameter optimization, and live execution"
readme = "README.md"
requires-python = ">=3.9"

# Runtime dependencies are pinned in requirements.txt (single source of truth).
# Install them with `pip install -r requirements.txt`, then make this repo
# importable with `pip install -e . --no-deps`.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pre-commit>=3.5",
]

[tool.setuptools]
# Flat layout: the top-level source packages live at the repo root.
packages = ["backtester", "optimizer", "execution", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repo root on sys.path so `import backtester` works when running
# pytest (and keeps `PYTHONPATH=.` prefixes unnecessary).
pythonpath = ["."]
addopts = "-ra"
